<p-toast position="top-right" />

<section class="admin-page collection-list-page">
  <app-admin-page-header
    [title]="'ADMIN.CATALOG_UI.INTERNAL_CATEGORIES' | translate"
    [subtitle]="subtitle()"
    [breadcrumbs]="breadcrumbs"
    [compactActions]="true"
  >
    <app-admin-icon-button
      adminHeaderActions
      *hamboxHasPermission="permissions.Catalog.Collections.Create"
      icon="pi pi-plus"
      [label]="'ADMIN.CATALOG_UI.CREATE_INTERNAL_CATEGORY' | translate"
      severity="primary"
      (pressed)="openCreateDialog()"
    />
  </app-admin-page-header>

  <app-admin-search-bar
    class="collection-list-page__search"
    [value]="searchTerm()"
    [placeholder]="'ADMIN.CATALOG_UI.SEARCH_INTERNAL_CATEGORIES_2' | translate"
    (searchChange)="onSearchChange($event)"
  />

  @if (error()) {
    <app-admin-error-alert [message]="error()!" (retry)="retryLoad()" />
  }

  <app-collection-tree
    (createCollection)="openCreateDialog()"
    (editCollection)="openEditDialog($event)"
    (deleteCollection)="requestDelete($event)"
    (addChildCollection)="openCreateDialogForParent($event)"
    (viewProducts)="viewProducts($event)"
  />
</section>

<p-dialog
  [header]="'ADMIN.CATALOG_UI.CREATE_INTERNAL_CATEGORY' | translate"
  [visible]="createDialogOpen()"
  (visibleChange)="onCreateDialogVisibleChange($event)"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(28rem, 92vw)' }"
  styleClass="admin-dialog"
  ariaLabelledBy="create-collection-dialog-title"
>
  <app-collection-create-form
    mode="create"
    [submitting]="creating()"
    [serverError]="createError()"
    [resetToken]="formResetToken()"
    [parentOptions]="parentOptions()"
    [initialParentId]="createParentId()"
    (submitted)="onCreateSubmitted($event)"
    (cancelled)="onCreateCancelled()"
  />
</p-dialog>

<p-drawer
  [visible]="editDialogOpen()"
  (visibleChange)="onEditDialogVisibleChange($event)"
  [header]="'ADMIN.CATALOG_UI.EDIT_INTERNAL_CATEGORY' | translate"
  position="right"
  [modal]="true"
  [dismissible]="true"
  [closeOnEscape]="true"
  appendTo="body"
  [style]="{ width: 'min(26rem, 92vw)' }"
  styleClass="collection-list-page__edit-drawer"
>
  <app-collection-create-form
    mode="edit"
    [submitting]="updating()"
    [serverError]="updateError()"
    [resetToken]="formResetToken()"
    [parentOptions]="editableParentOptions()"
    [initialCollection]="editingCollection()"
    (updateSubmitted)="onUpdateSubmitted($event)"
  />
</p-drawer>

<app-admin-confirm-dialog
  [visible]="deleteDialogOpen()"
  [title]="'ADMIN.CATALOG_UI.DELETE_INTERNAL_CATEGORY' | translate"
  [message]="deleteDialogMessage()"
  [destructive]="true"
  [loading]="deleting()"
  (visibleChange)="deleteDialogOpen.set($event)"
  (confirmed)="confirmDelete()"
/>
