<p-toast position="top-right" />

<section class="admin-page category-list-page">
  <app-admin-page-header
    title="Categories"
    [subtitle]="subtitle()"
    [breadcrumbs]="breadcrumbs"
  >
    <button
      adminHeaderActions
      *hamboxHasPermission="permissions.Catalog.Categories.Create"
      pButton
      type="button"
      class="admin-btn-primary"
      label="Create Category"
      icon="pi pi-plus"
      (click)="openCreateDialog()"
    ></button>
  </app-admin-page-header>

  <app-admin-stat-grid>
    <app-admin-stat-card
      [compact]="true"
      label="Total Categories"
      [value]="listStats().total"
      icon="pi-tags"
    />
    <app-admin-stat-card
      [compact]="true"
      label="Active"
      [value]="listStats().active"
      hint="On this page"
      icon="pi-check-circle"
      tone="success"
    />
    <app-admin-stat-card
      [compact]="true"
      label="Inactive"
      [value]="listStats().inactive"
      hint="On this page"
      icon="pi-ban"
      tone="default"
    />
  </app-admin-stat-grid>

  <app-admin-toolbar>
    <app-admin-search-bar
      adminToolbarSearch
      [value]="searchTerm()"
      placeholder="Search categories by name or slug..."
      (searchChange)="onSearchChange($event)"
    />
    <p-select
      adminToolbarFilters
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Filter status"
      [ngModel]="statusFilter()"
      (ngModelChange)="onStatusFilterChange($event)"
    />
    @if (hasActiveFilters()) {
      <button
        adminToolbarActions
        pButton
        type="button"
        label="Clear filters"
        icon="pi pi-filter-slash"
        severity="secondary"
        text
        (click)="onClearFilters()"
      ></button>
    }
  </app-admin-toolbar>

  @if (error()) {
    <app-admin-error-alert [message]="error()!" (retry)="retryLoad()" />
  }

  <app-category-table
    [categories]="items()"
    [parentOptions]="items()"
    [loading]="loading()"
    [totalRecords]="totalCount()"
    [pageSize]="pageSize()"
    [first]="tableFirst()"
    [searchActive]="hasActiveSearch()"
    (pageChange)="onPageChange($event)"
    (createCategory)="openCreateDialog()"
    (editCategory)="openEditDialog($event)"
    (deleteCategory)="requestDelete($event)"
    (restoreCategory)="restoreCategory($event)"
  />
</section>

<p-dialog
  header="Create Category"
  [visible]="createDialogOpen()"
  (visibleChange)="onCreateDialogVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(32rem, 92vw)' }"
  styleClass="admin-dialog"
  ariaLabelledBy="create-category-dialog-title"
>
  <app-category-create-form
    mode="create"
    [submitting]="creating()"
    [serverError]="createError()"
    [resetToken]="formResetToken()"
    [parentOptions]="parentOptions()"
    (submitted)="onCreateSubmitted($event)"
    (cancelled)="onCreateCancelled()"
  />
</p-dialog>

<p-dialog
  header="Edit Category"
  [visible]="editDialogOpen()"
  (visibleChange)="onEditDialogVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(32rem, 92vw)' }"
  styleClass="admin-dialog"
>
  <app-category-create-form
    mode="edit"
    [submitting]="updating()"
    [serverError]="updateError()"
    [resetToken]="formResetToken()"
    [parentOptions]="parentOptions()"
    [initialCategory]="editingCategory()"
    (updateSubmitted)="onUpdateSubmitted($event)"
    (cancelled)="onEditCancelled()"
  />
</p-dialog>

<app-admin-confirm-dialog
  [visible]="deleteDialogOpen()"
  title="Delete category"
  [message]="deleteDialogMessage()"
  [destructive]="true"
  [loading]="deleting()"
  (visibleChange)="deleteDialogOpen.set($event)"
  (confirmed)="confirmDelete()"
/>
