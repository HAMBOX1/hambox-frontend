<p-toast position="top-right" />

<section class="category-list-page">
  <header class="category-list-page__header">
    <div class="category-list-page__heading">
      <h1 class="category-list-page__title">Categories</h1>
      <p class="category-list-page__subtitle">{{ subtitle() }}</p>
    </div>

    <button
      pButton
      type="button"
      class="category-list-page__create-btn"
      label="Create Category"
      icon="pi pi-plus"
      (click)="openCreateDialog()"
    ></button>
  </header>

  <div class="category-list-page__toolbar">
    <label class="category-list-page__search">
      <i class="pi pi-search category-list-page__search-icon" aria-hidden="true"></i>
      <input
        pInputText
        class="category-list-page__search-input"
        type="search"
        placeholder="Search categories by name or slug..."
        [value]="searchTerm()"
        (input)="onSearchInput($event)"
      />
    </label>
  </div>

  @if (error()) {
    <div class="category-list-page__alert" role="alert">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span>{{ error() }}</span>
      <button
        pButton
        type="button"
        class="category-list-page__retry-btn"
        label="Retry"
        severity="secondary"
        size="small"
        (click)="retryLoad()"
      ></button>
    </div>
  }

  <app-category-table
    [categories]="items()"
    [loading]="loading()"
    [totalRecords]="totalCount()"
    [pageSize]="pageSize()"
    [first]="tableFirst()"
    [searchActive]="hasActiveSearch()"
    (pageChange)="onPageChange($event)"
  />
</section>

<p-dialog
  header="Create Category"
  [visible]="createDialogOpen()"
  (visibleChange)="onDialogVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(32rem, 92vw)' }"
  styleClass="admin-dialog"
  ariaLabelledBy="create-category-dialog-title"
>
  <app-category-create-form
    [submitting]="creating()"
    [serverError]="createError()"
    [resetToken]="formResetToken()"
    (submitted)="onCreateSubmitted($event)"
    (cancelled)="onCreateCancelled()"
  />
</p-dialog>
