<p-toast position="top-right" />

<section class="admin-page category-list-page">
  <app-admin-page-header
    title="Categories"
    [subtitle]="subtitle()"
    [breadcrumbs]="breadcrumbs"
    [compactActions]="true"
  >
    <app-admin-icon-button
      adminHeaderActions
      icon="pi pi-download"
      label="Export Categories"
      severity="secondary"
      (pressed)="exportCategories()"
    />
    <app-admin-icon-button
      adminHeaderActions
      *hamboxHasPermission="permissions.Catalog.Categories.Create"
      icon="pi pi-plus"
      label="Create Category"
      severity="primary"
      (pressed)="openCreateDialog()"
    />
  </app-admin-page-header>

  <app-admin-search-bar
    class="category-list-page__search"
    [value]="searchTerm()"
    placeholder="Search the category tree..."
    (searchChange)="onSearchChange($event)"
  />

  @if (error()) {
    <app-admin-error-alert [message]="error()!" (retry)="retryLoad()" />
  }

  <app-category-tree
    (createCategory)="openCreateDialog()"
    (editCategory)="openEditDialog($event)"
    (deleteCategory)="requestDelete($event)"
    (addChildCategory)="openCreateDialogForParent($event)"
  />
</section>

<p-dialog
  header="Create Category"
  [visible]="createDialogOpen()"
  (visibleChange)="onCreateDialogVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(32rem, 92vw)' }"
  styleClass="admin-dialog"
  ariaLabelledBy="create-category-dialog-title"
>
  <app-category-create-form
    mode="create"
    [submitting]="creating()"
    [serverError]="createError()"
    [resetToken]="formResetToken()"
    [parentOptions]="parentOptions()"
    [initialParentId]="createParentId()"
    (submitted)="onCreateSubmitted($event)"
    (cancelled)="onCreateCancelled()"
  />
</p-dialog>

<p-drawer
  [visible]="editDialogOpen()"
  (visibleChange)="onEditDialogVisibleChange($event, editForm)"
  header="Edit Category"
  position="right"
  [modal]="true"
  [dismissible]="true"
  [closeOnEscape]="true"
  appendTo="body"
  [style]="{ width: 'min(28rem, 92vw)' }"
  styleClass="category-list-page__edit-drawer"
>
  <app-category-create-form
    #editForm
    mode="edit"
    [submitting]="updating()"
    [serverError]="updateError()"
    [resetToken]="formResetToken()"
    [parentOptions]="editableParentOptions()"
    [initialCategory]="editingCategory()"
    (updateSubmitted)="onUpdateSubmitted($event)"
    (deleteRequested)="requestDeleteFromEditForm()"
  />
</p-drawer>

<app-admin-confirm-dialog
  [visible]="deleteDialogOpen()"
  title="Delete category"
  [message]="deleteDialogMessage()"
  [destructive]="true"
  [loading]="deleting()"
  (visibleChange)="deleteDialogOpen.set($event)"
  (confirmed)="confirmDelete()"
/>

<app-admin-confirm-dialog
  [visible]="discardChangesDialogOpen()"
  title="Discard your changes?"
  message="You have unsaved changes that will be lost if you leave now."
  confirmLabel="Discard"
  cancelLabel="Stay Editing"
  [destructive]="true"
  (visibleChange)="discardChangesDialogOpen.set($event)"
  (confirmed)="confirmDiscardChanges()"
/>
