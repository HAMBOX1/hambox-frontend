<nav class="create-stepper" aria-label="Product creation steps">
  @for (step of visibleSteps(); track step.id) {
    <button
      type="button"
      class="create-stepper__item"
      [class.create-stepper__item--active]="step.id === activeStep()"
      (click)="onStepClick(step)"
    >
      {{ step.label }}
    </button>
  }
</nav>
