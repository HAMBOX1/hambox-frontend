<app-admin-toolbar>
  <app-admin-search-bar
    adminToolbarSearch
    [value]="searchTerm()"
    [placeholder]="searchPlaceholder()"
    (searchChange)="onSearchChange($event)"
  />
  <p-select
    adminToolbarFilters
    [options]="statusOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="Filter status"
    [ngModel]="statusFilter()"
    (ngModelChange)="onStatusChange($event)"
  />
</app-admin-toolbar>
