<app-admin-toolbar [compact]="true">
  <app-admin-search-bar
    adminToolbarSearch
    [value]="searchTerm()"
    [placeholder]="searchPlaceholder()"
    (searchChange)="onSearchChange($event)"
  />
  <p-select
    adminToolbarFilters
    [options]="statusOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="Filter status"
    [ngModel]="statusFilter()"
    (ngModelChange)="onStatusChange($event)"
  />
  <p-select
    adminToolbarFilters
    [options]="[...collectionOptions()]"
    optionLabel="label"
    optionValue="id"
    placeholder="Filter collection"
    [showClear]="true"
    [ngModel]="collectionFilter()"
    (ngModelChange)="onCollectionChange($event)"
  />
  <app-admin-icon-button
    adminToolbarActions
    [icon]="viewMode() === 'table' ? 'pi pi-th-large' : 'pi pi-table'"
    [label]="viewMode() === 'table' ? 'Card view' : 'Table view'"
    (pressed)="toggleViewMode()"
  />
  @if (hasActiveFilters()) {
    <app-admin-icon-button
      adminToolbarActions
      icon="pi pi-filter-slash"
      label="Clear filters"
      (pressed)="clearFilters.emit()"
    />
  }
</app-admin-toolbar>
