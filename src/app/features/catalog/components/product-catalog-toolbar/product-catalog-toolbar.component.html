<app-admin-toolbar>
  <app-admin-search-bar
    adminToolbarSearch
    [value]="searchTerm()"
    [placeholder]="searchPlaceholder()"
    (searchChange)="onSearchChange($event)"
  />
  <p-select
    adminToolbarFilters
    [options]="statusOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="Filter status"
    [ngModel]="statusFilter()"
    (ngModelChange)="onStatusChange($event)"
  />
  @if (hasActiveFilters()) {
    <button
      adminToolbarActions
      pButton
      type="button"
      label="Clear filters"
      icon="pi pi-filter-slash"
      severity="secondary"
      text
      (click)="clearFilters.emit()"
    ></button>
  }
</app-admin-toolbar>
