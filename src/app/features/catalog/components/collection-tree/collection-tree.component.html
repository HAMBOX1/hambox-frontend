@if (loading() && tree().length === 0) {
  <app-admin-loading-skeleton variant="table" [rows]="6" />
} @else if (isEmpty()) {
  <app-admin-empty-state
    icon="pi pi-folder"
    [title]="hasActiveSearch() ? 'No matching internal categories' : 'No internal categories yet'"
    [description]="
      hasActiveSearch()
        ? 'Try a different search term or clear the search to see the full tree.'
        : 'Create your first internal category to start organizing products internally.'
    "
    [primaryLabel]="hasActiveSearch() ? null : 'Create Internal Category'"
    [primaryIcon]="hasActiveSearch() ? null : 'pi pi-plus'"
    (primaryAction)="onCreateRequested()"
  />
} @else {
  <div class="collection-tree">
    @for (root of tree(); track root.id) {
      <app-collection-tree-node [node]="root" [depth]="0" [callbacks]="callbacks" />
    }
  </div>
}
