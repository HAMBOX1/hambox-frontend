@if (loading()) {
  <app-admin-loading-skeleton variant="table" />
} @else {
  <app-admin-section-card
    title="Option Groups"
    description="Define the options customers choose from when configuring this product, like Platform, Region, or Edition."
    [compact]="compact()"
  >
    @if (viewport.isMobile()) {
      <app-option-mobile-nav [allGroups]="optionGroups()" />
    } @else {
      @if (sortedRootGroups().length) {
        <div
          class="option-groups-panel__groups"
          cdkDropList
          (cdkDropListDropped)="onGroupDrop($event)"
        >
          @for (group of sortedRootGroups(); track group.id) {
            <div class="option-groups-panel__group" cdkDrag>
              <button type="button" class="option-groups-panel__drag-handle" cdkDragHandle aria-label="Reorder option group">
                <i class="pi pi-bars"></i>
              </button>
              <app-option-group-node [group]="group" [allGroups]="optionGroups()" />
            </div>
          }
        </div>
      } @else {
        <app-admin-empty-state
          icon="pi pi-question-circle"
          title="No option groups yet"
          description="Create option groups (like Platform or Region) before adding variants."
        />
      }

      <div class="option-groups-panel__new-group" *hamboxHasPermission="permissions.Catalog.Inventory.Create">
        @if (productId()) {
          <div class="option-groups-panel__inline-form">
            <input
              pInputText
              placeholder="Option group name (e.g. Platform)"
              [ngModel]="newGroupLabel()"
              (ngModelChange)="newGroupLabel.set($event)"
            />
            <button pButton type="button" label="Add Option Group" icon="pi pi-plus" [loading]="creatingGroup()" (click)="createOptionGroup()"></button>
          </div>
        } @else {
          <p class="option-groups-panel__hint">Enter a product name and category above to begin.</p>
        }
      </div>
    }
  </app-admin-section-card>
}
