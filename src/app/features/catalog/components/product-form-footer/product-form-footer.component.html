<footer class="product-form-footer">
  <button
    pButton
    type="button"
    class="product-form-footer__btn product-form-footer__btn--ghost"
    [label]="'ADMIN.CATALOG_UI.CANCEL' | translate"
    severity="secondary"
    [disabled]="submitting()"
    (click)="onCancel()"
  ></button>

  <div class="product-form-footer__actions">
    <button
      pButton
      type="button"
      class="product-form-footer__btn"
      [label]="'ADMIN.CATALOG_UI.SAVE_DRAFT' | translate"
      icon="pi pi-save"
      severity="secondary"
      [outlined]="true"
      disabled
      aria-disabled="true"
    ></button>

    <button
      pButton
      type="button"
      class="product-form-footer__btn"
      [label]="'ADMIN.CATALOG_UI.NEXT_STEP' | translate"
      icon="pi pi-arrow-right"
      iconPos="right"
      severity="secondary"
      [outlined]="true"
      disabled
      aria-disabled="true"
    ></button>

    <button
      pButton
      type="button"
      class="product-form-footer__btn product-form-footer__btn--primary"
      [label]="'ADMIN.CATALOG_UI.CREATE_PRODUCT' | translate"
      icon="pi pi-check"
      [loading]="submitting()"
      [disabled]="submitting()"
      (click)="onCreate()"
    ></button>
  </div>
</footer>
