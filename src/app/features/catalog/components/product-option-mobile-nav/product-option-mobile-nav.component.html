@if (rootGroups().length) {
  <div class="mobile-nav__groups">
    @for (group of rootGroups(); track group.id; let count = $count) {
      <app-option-mobile-group-card
        [group]="group"
        [allGroups]="allGroups()"
        [canReorderGroup]="count > 1"
        (moveGroup)="moveGroup(group, $event)"
      />
    }
  </div>
} @else {
  <app-admin-empty-state
    icon="pi pi-question-circle"
    [title]="'ADMIN.CATALOG_UI.NO_OPTION_GROUPS_YET' | translate"
    [description]="'ADMIN.CATALOG_UI.CREATE_OPTION_GROUPS_LIKE_PLATFORM_OR_REGION' | translate"
  />
}

<div class="mobile-nav__add-group" *hamboxHasPermission="permissions.Catalog.Inventory.Create">
  @if (productId()) {
    <span class="mobile-nav__add-group-label">{{ 'ADMIN.CATALOG_UI.NEW_OPTION_GROUP' | translate }}</span>
    <input
      pInputText
      [placeholder]="'ADMIN.CATALOG_UI.E_G_PLATFORM' | translate"
      [ngModel]="newGroupLabel()"
      (ngModelChange)="newGroupLabel.set($event)"
      (keyup.enter)="addGroup()"
    />
    <button pButton type="button" [label]="'ADMIN.CATALOG_UI.ADD_OPTION_GROUP' | translate" icon="pi pi-plus" [loading]="creatingGroup()" (click)="addGroup()"></button>
  } @else {
    <p class="mobile-nav__hint">{{ 'ADMIN.CATALOG_UI.ENTER_A_PRODUCT_NAME_AND_CATEGORY_ABOVE_TO_B' | translate }}</p>
  }
</div>
