@if (loading() && categories().length === 0) {
  <app-admin-loading-skeleton variant="table" [rows]="6" />
} @else {
  <app-admin-data-table-shell>
    <p-table
      class="admin-data-table"
      [value]="[...categories()]"
      [loading]="loading()"
      [lazy]="true"
      [paginator]="totalRecords() > 0"
      [rows]="pageSize()"
      [totalRecords]="totalRecords()"
      [first]="first()"
      [rowsPerPageOptions]="[10, 20, 50]"
      (onLazyLoad)="onLazyLoad($event)"
      dataKey="id"
      scrollable
      scrollHeight="flex"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Name (EN)</th>
          <th>Name (AR)</th>
          <th>Slug</th>
          <th>Parent</th>
          <th>Status</th>
          <th style="width: 6.5rem"></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-category>
        <tr>
          <td>
            <span class="admin-cell-primary">{{ category.nameEn }}</span>
          </td>
          <td>
            <span class="admin-cell-primary category-table__name--rtl" dir="rtl">{{ category.nameAr }}</span>
          </td>
          <td>
            <code class="admin-cell-secondary category-table__slug">{{ category.slug }}</code>
          </td>
          <td>{{ parentLabel(category) }}</td>
          <td>
            <app-admin-status-badge
              [label]="category.isActive ? 'Active' : 'Inactive'"
              [tone]="category.isActive ? 'success' : 'neutral'"
            />
          </td>
          <td>
            <div class="admin-actions-row">
              <app-admin-icon-button
                *hamboxHasPermission="permissions.Catalog.Categories.Edit"
                icon="pi pi-pencil"
                label="Edit category"
                (pressed)="editCategory.emit(category)"
              />
              @if (category.isActive) {
                <app-admin-icon-button
                  *hamboxHasPermission="permissions.Catalog.Categories.Delete"
                  icon="pi pi-trash"
                  label="Delete category"
                  severity="danger"
                  (pressed)="deleteCategory.emit(category)"
                />
              } @else {
                <app-admin-icon-button
                  *hamboxHasPermission="permissions.Catalog.Categories.Edit"
                  icon="pi pi-replay"
                  label="Restore category"
                  (pressed)="restoreCategory.emit(category)"
                />
              }
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6">
            <app-admin-empty-state
              icon="pi pi-inbox"
              [title]="searchActive() ? 'No matching categories' : 'No categories yet'"
              [description]="
                searchActive()
                  ? 'Try a different search term or clear the filter to see all categories.'
                  : 'Create your first category to organize products in the catalog.'
              "
              [primaryLabel]="searchActive() ? null : 'Create Category'"
              [primaryIcon]="searchActive() ? null : 'pi pi-plus'"
              (primaryAction)="createCategory.emit()"
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </app-admin-data-table-shell>
}
