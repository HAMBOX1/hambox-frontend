<p-toast position="top-right" />

<section class="admin-page membership-edit-page">
  <app-admin-page-header
    [title]="
      isCreateMode()
        ? ('ADMIN.MEMBERSHIPS.EDIT.CREATE_TITLE' | translate)
        : ('ADMIN.MEMBERSHIPS.EDIT.EDIT_TITLE' | translate)
    "
    [subtitle]="'ADMIN.MEMBERSHIPS.LIST.SUBTITLE' | translate"
    backLink="/admin/memberships"
    [backLabel]="'ADMIN.MEMBERSHIPS.EDIT.BACK' | translate"
    [breadcrumbs]="breadcrumbs()"
  />

  @if (detailLoading()) {
    <app-admin-loading-skeleton variant="form" />
  } @else {
    @if (detailError()) {
      <app-admin-error-alert [message]="detailError()!" />
    }

    <form class="membership-edit-page__form" (ngSubmit)="$event.preventDefault(); save()">
      <app-admin-section-card [title]="'ADMIN.MEMBERSHIPS.EDIT.DETAILS' | translate">
        <div class="admin-form-grid">
          <label class="admin-field">
            <span class="admin-field__label">{{ 'ADMIN.MEMBERSHIPS.EDIT.NAME' | translate }}</span>
            <input
              pInputText
              class="admin-field__input"
              type="text"
              [ngModel]="name()"
              (ngModelChange)="onNameInput($event)"
              name="name"
              required
            />
          </label>

          <label class="admin-field">
            <span class="admin-field__label">{{ 'ADMIN.MEMBERSHIPS.EDIT.PRICE' | translate }}</span>
            <p-inputNumber
              [ngModel]="price()"
              (ngModelChange)="price.set($event ?? 0)"
              name="price"
              mode="currency"
              currency="USD"
              [min]="0"
            />
          </label>

          <label class="admin-field">
            <span class="admin-field__label">{{ 'ADMIN.MEMBERSHIPS.EDIT.DURATION' | translate }}</span>
            <p-inputNumber
              [ngModel]="durationDays()"
              (ngModelChange)="durationDays.set($event ?? 30)"
              name="durationDays"
              suffix=" days"
              [min]="1"
              [minFractionDigits]="0"
              [maxFractionDigits]="0"
            />
          </label>

          <label class="admin-field">
            <span class="admin-field__label">{{ 'ADMIN.MEMBERSHIPS.EDIT.BADGE' | translate }}</span>
            <input
              pInputText
              class="admin-field__input"
              type="text"
              [ngModel]="badgeLabel()"
              (ngModelChange)="badgeLabel.set($event)"
              name="badgeLabel"
              [placeholder]="'ADMIN.MEMBERSHIPS.EDIT.BADGE_PLACEHOLDER' | translate"
            />
          </label>

          <label class="admin-field membership-edit-page__field--wide">
            <span class="admin-field__label">{{ 'ADMIN.MEMBERSHIPS.EDIT.DESCRIPTION' | translate }}</span>
            <textarea
              pTextarea
              class="admin-field__input"
              rows="3"
              [ngModel]="description()"
              (ngModelChange)="description.set($event)"
              name="description"
            ></textarea>
          </label>
        </div>
      </app-admin-section-card>

      <app-admin-section-card
        [title]="'ADMIN.MEMBERSHIPS.EDIT.ADVANCED' | translate"
        [description]="'ADMIN.MEMBERSHIPS.EDIT.ADVANCED_HINT' | translate"
        [collapsible]="true"
        [(collapsed)]="advancedCollapsed"
      >
        <div class="admin-form-grid">
          <label class="admin-field">
            <span class="admin-field__label">{{ 'ADMIN.MEMBERSHIPS.EDIT.SLUG' | translate }}</span>
            <input
              pInputText
              class="admin-field__input"
              type="text"
              [ngModel]="slug()"
              (ngModelChange)="onSlugInput($event)"
              name="slug"
              required
            />
            <span class="admin-field__hint">{{ 'ADMIN.MEMBERSHIPS.EDIT.SLUG_HINT' | translate }}</span>
          </label>

          <label class="admin-field">
            <span class="admin-field__label">{{ 'ADMIN.MEMBERSHIPS.EDIT.SORT_ORDER' | translate }}</span>
            <p-inputNumber
              [ngModel]="sortOrder()"
              (ngModelChange)="sortOrder.set($event ?? 0)"
              name="sortOrder"
              [min]="0"
              [minFractionDigits]="0"
              [maxFractionDigits]="0"
            />
          </label>

          @if (isCreateMode()) {
            <label class="membership-edit-page__toggle">
              <p-toggleswitch
                [ngModel]="isDefault()"
                (ngModelChange)="isDefault.set($event)"
                name="isDefault"
              />
              <span>{{ 'ADMIN.MEMBERSHIPS.EDIT.IS_DEFAULT' | translate }}</span>
            </label>
          }
        </div>
      </app-admin-section-card>

      <app-benefits-config-panel
        *hamboxHasPermission="permissions.Memberships.ConfigureBenefits"
        [benefits]="benefits()"
        [disabled]="detailSaving()"
        (benefitsChange)="benefits.set($event)"
        [exclusiveProductIds]="exclusiveProductIds()"
        (exclusiveProductIdsChange)="exclusiveProductIds.set($event)"
        [unlockedThemeIds]="unlockedThemeIds()"
        (unlockedThemeIdsChange)="unlockedThemeIds.set($event)"
      />

      <app-admin-sticky-save-bar>
        <a
          pButton
          routerLink="/admin/memberships"
          [label]="'ADMIN.MEMBERSHIPS.ACTIONS.CANCEL' | translate"
          severity="secondary"
          [text]="true"
        ></a>
        <button
          pButton
          type="submit"
          [label]="'ADMIN.MEMBERSHIPS.ACTIONS.SAVE' | translate"
          icon="pi pi-check"
          [loading]="detailSaving()"
        ></button>
      </app-admin-sticky-save-bar>
    </form>
  }
</section>

<app-admin-unsaved-changes-dialog
  [visible]="unsavedDialogOpen()"
  [saving]="detailSaving()"
  (visibleChange)="onUnsavedDialogVisibleChange($event)"
  (save)="onUnsavedSave()"
  (discard)="onUnsavedDiscard()"
/>
