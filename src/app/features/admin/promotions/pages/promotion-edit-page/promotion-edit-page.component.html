<p-toast position="top-right" />

<section class="admin-page promotion-edit-page">
  <app-admin-page-header
    [backLink]="'/admin/promotions'"
    [backLabel]="'ADMIN.PROMOTIONS.EDIT.BACK' | translate"
    [title]="
      isCreateMode()
        ? ('ADMIN.PROMOTIONS.EDIT.CREATE_TITLE' | translate)
        : ('ADMIN.PROMOTIONS.EDIT.EDIT_TITLE' | translate)
    "
    [subtitle]="'ADMIN.PROMOTIONS.LIST.SUBTITLE' | translate"
    [breadcrumbs]="breadcrumbs()"
  />

  @if (detailError()) {
    <app-admin-error-alert [message]="detailError()!" />
  }

  @if (detailLoading()) {
    <app-admin-loading-skeleton variant="form" />
  } @else {
    <form class="promotion-edit-page__form" (ngSubmit)="save()">
      <div class="admin-detail-layout">
        <app-admin-section-card [title]="'ADMIN.PROMOTIONS.EDIT.DETAILS' | translate">
          <div class="admin-form-grid admin-form-grid--single">
            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.NAME' | translate }}</span>
              <input
                pInputText
                class="admin-field__input"
                type="text"
                [ngModel]="name()"
                (ngModelChange)="name.set($event)"
                name="name"
                required
              />
            </label>

            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.DESCRIPTION' | translate }}</span>
              <textarea
                pTextarea
                class="admin-field__input"
                rows="3"
                [ngModel]="description()"
                (ngModelChange)="description.set($event)"
                name="description"
              ></textarea>
            </label>

            @if (isCreateMode()) {
              <label class="admin-field">
                <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.TYPE' | translate }}</span>
                <p-select
                  [options]="typeOptions"
                  optionLabel="label"
                  optionValue="value"
                  [ngModel]="type()"
                  (ngModelChange)="type.set($event)"
                  name="type"
                />
              </label>

              @if (type() === 'CouponCode') {
                <label class="admin-field">
                  <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.INITIAL_COUPON' | translate }}</span>
                  <input
                    pInputText
                    class="admin-field__input"
                    type="text"
                    [ngModel]="initialCouponCode()"
                    (ngModelChange)="initialCouponCode.set($event)"
                    name="initialCouponCode"
                  />
                </label>
              }
            }
          </div>

          <div class="admin-form-grid">
            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.DISCOUNT_TYPE' | translate }}</span>
              <p-select
                [options]="discountTypeOptions"
                optionLabel="label"
                optionValue="value"
                [ngModel]="discountType()"
                (ngModelChange)="discountType.set($event)"
                name="discountType"
              />
            </label>

            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.DISCOUNT_VALUE' | translate }}</span>
              <p-inputNumber
                [ngModel]="discountValue()"
                (ngModelChange)="discountValue.set($event)"
                name="discountValue"
                [min]="0.01"
                mode="decimal"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
              />
            </label>

            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.START_DATE' | translate }}</span>
              <input
                type="datetime-local"
                class="admin-field__input promotion-edit-page__date-input"
                [ngModel]="startDate()"
                (ngModelChange)="startDate.set($event)"
                name="startDate"
              />
            </label>

            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.END_DATE' | translate }}</span>
              <input
                type="datetime-local"
                class="admin-field__input promotion-edit-page__date-input"
                [ngModel]="endDate()"
                (ngModelChange)="endDate.set($event)"
                name="endDate"
              />
            </label>
          </div>
        </app-admin-section-card>

        <app-admin-section-card [title]="'ADMIN.PROMOTIONS.EDIT.CONDITIONS' | translate">
          <div class="admin-form-grid">
            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.MIN_ORDER' | translate }}</span>
              <p-inputNumber
                [ngModel]="minOrderAmount()"
                (ngModelChange)="minOrderAmount.set($event)"
                name="minOrderAmount"
                [min]="0"
                mode="decimal"
              />
            </label>

            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.MAX_DISCOUNT' | translate }}</span>
              <p-inputNumber
                [ngModel]="maxDiscountAmount()"
                (ngModelChange)="maxDiscountAmount.set($event)"
                name="maxDiscountAmount"
                [min]="0"
                mode="decimal"
              />
            </label>

            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.USAGE_LIMIT' | translate }}</span>
              <p-inputNumber
                [ngModel]="usageLimit()"
                (ngModelChange)="usageLimit.set($event)"
                name="usageLimit"
                [min]="0"
              />
            </label>

            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.PER_USER_LIMIT' | translate }}</span>
              <p-inputNumber
                [ngModel]="perUserLimit()"
                (ngModelChange)="perUserLimit.set($event)"
                name="perUserLimit"
                [min]="0"
              />
            </label>
          </div>

          <div class="promotion-edit-page__checks">
            <label class="promotion-edit-page__check">
              <p-checkbox [ngModel]="firstPurchaseOnly()" (ngModelChange)="firstPurchaseOnly.set($event)" name="firstPurchaseOnly" [binary]="true" />
              <span>{{ 'ADMIN.PROMOTIONS.EDIT.FIRST_PURCHASE' | translate }}</span>
            </label>

            <label class="promotion-edit-page__check">
              <p-checkbox [ngModel]="membershipRequired()" (ngModelChange)="membershipRequired.set($event)" name="membershipRequired" [binary]="true" />
              <span>{{ 'ADMIN.PROMOTIONS.EDIT.MEMBERSHIP_REQUIRED' | translate }}</span>
            </label>
          </div>
        </app-admin-section-card>

        <app-admin-section-card [title]="'ADMIN.PROMOTIONS.EDIT.TARGETS' | translate">
          <div class="admin-form-grid admin-form-grid--single">
            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.PRODUCT_IDS' | translate }}</span>
              <input
                pInputText
                class="admin-field__input"
                type="text"
                [ngModel]="productTargetIds()"
                (ngModelChange)="productTargetIds.set($event)"
                name="productTargetIds"
                [placeholder]="'ADMIN.PROMOTIONS.EDIT.GUID_PLACEHOLDER' | translate"
              />
            </label>

            <label class="admin-field">
              <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.EDIT.CATEGORY_IDS' | translate }}</span>
              <input
                pInputText
                class="admin-field__input"
                type="text"
                [ngModel]="categoryTargetIds()"
                (ngModelChange)="categoryTargetIds.set($event)"
                name="categoryTargetIds"
                [placeholder]="'ADMIN.PROMOTIONS.EDIT.GUID_PLACEHOLDER' | translate"
              />
            </label>
          </div>
        </app-admin-section-card>
      </div>

      <app-admin-sticky-save-bar>
        <a pButton routerLink="/admin/promotions" [label]="'ADMIN.PROMOTIONS.ACTIONS.CANCEL' | translate" severity="secondary" [text]="true"></a>
        <button
          pButton
          type="submit"
          [label]="'ADMIN.PROMOTIONS.ACTIONS.SAVE' | translate"
          icon="pi pi-check"
          [loading]="detailSaving()"
          [disabled]="detailSaving() || !name().trim()"
        ></button>
      </app-admin-sticky-save-bar>
    </form>
  }
</section>
