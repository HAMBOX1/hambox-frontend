<div class="admin-form-grid admin-form-grid--single">
  @if (mode() === 'bulk') {
    <label class="admin-field">
      <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.COUPONS.COUNT' | translate }}</span>
      <p-inputNumber
        [ngModel]="value().count"
        (ngModelChange)="patch({ count: $event })"
        [min]="1"
        [max]="500"
      />
    </label>
    <label class="admin-field">
      <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.COUPONS.PREFIX' | translate }}</span>
      <input
        pInputText
        class="admin-field__input"
        type="text"
        [ngModel]="value().prefix"
        (ngModelChange)="patch({ prefix: $event })"
      />
    </label>
  } @else {
    <label class="admin-field">
      <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.COUPONS.CODE' | translate }}</span>
      <input
        pInputText
        class="admin-field__input"
        type="text"
        [ngModel]="value().code"
        (ngModelChange)="patch({ code: $event })"
      />
    </label>
  }

  <label class="admin-field">
    <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.COUPONS.MAX_USES' | translate }}</span>
    <p-inputNumber
      [ngModel]="value().maxUses"
      (ngModelChange)="patch({ maxUses: $event })"
      [min]="0"
      [disabled]="value().isSingleUse"
      [placeholder]="
        value().isSingleUse
          ? ('ADMIN.PROMOTIONS.COUPONS.SINGLE_USE_LOCKED' | translate)
          : ('ADMIN.PROMOTIONS.COUPONS.UNLIMITED' | translate)
      "
    />
  </label>

  <label class="admin-field">
    <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.COUPONS.PER_USER_MAX_USES' | translate }}</span>
    <p-inputNumber
      [ngModel]="value().perUserMaxUses"
      (ngModelChange)="patch({ perUserMaxUses: $event })"
      [min]="0"
      [placeholder]="'ADMIN.PROMOTIONS.COUPONS.UNLIMITED' | translate"
    />
  </label>

  <label class="admin-field">
    <span class="admin-field__label">{{ 'ADMIN.PROMOTIONS.COUPONS.EXPIRES' | translate }}</span>
    <input
      type="datetime-local"
      class="admin-field__input generate-coupons-form__date-input"
      [ngModel]="value().expiresOnUtc"
      (ngModelChange)="patch({ expiresOnUtc: $event })"
    />
  </label>
</div>

<label class="generate-coupons-form__check">
  <p-checkbox
    [ngModel]="value().isSingleUse"
    (ngModelChange)="onSingleUseChange($event)"
    [binary]="true"
  />
  <span>{{ 'ADMIN.PROMOTIONS.COUPONS.SINGLE_USE' | translate }}</span>
</label>
