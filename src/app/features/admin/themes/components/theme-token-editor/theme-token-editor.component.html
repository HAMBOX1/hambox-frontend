@for (section of sections; track section.id) {
  <app-admin-section-card [title]="section.labelKey | translate">
    <div class="theme-token-editor__grid">
      @for (tokenKey of section.tokens; track tokenKey) {
        <label class="theme-token-editor__field">
          <span class="theme-token-editor__label">{{ tokenLabel(tokenKey) | translate }}</span>
          <input
            pInputText
            class="theme-token-editor__input"
            [disabled]="disabled()"
            [ngModel]="tokenValue(tokenKey)"
            (ngModelChange)="onTokenChange(tokenKey, $event)"
          />
        </label>
      }
    </div>
  </app-admin-section-card>
}
