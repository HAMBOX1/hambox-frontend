<section class="admin-page admin-stub-page">
  <app-admin-page-header
    [title]="title()"
    [subtitle]="description()"
    [breadcrumbs]="breadcrumbs()"
  />

  <app-admin-section-card [padded]="false" [noDivider]="true">
    <app-admin-empty-state
      [icon]="stubIcon()"
      [title]="'ADMIN.STUB.COMING_SOON_TITLE' | translate"
      [description]="'ADMIN.STUB.COMING_SOON_BODY' | translate"
      [primaryLabel]="'ADMIN.STUB.BACK_TO_INVENTORY' | translate"
      primaryIcon="pi pi-box"
      (primaryAction)="navigateInventory()"
    />
  </app-admin-section-card>
</section>
