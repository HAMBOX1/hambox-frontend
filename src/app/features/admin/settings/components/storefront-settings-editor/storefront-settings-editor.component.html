<div class="storefront-editor">
  <app-admin-section-card
    [title]="'ADMIN.SETTINGS.STOREFRONT.SEO.TITLE_CARD' | translate"
    [description]="'ADMIN.SETTINGS.STOREFRONT.SEO.DESCRIPTION_CARD' | translate"
  >
    <div class="storefront-editor__grid">
      @for (field of seoFields; track field.key) {
        <app-settings-field
          [field]="field"
          [value]="section('seo')[field.key]"
          [disabled]="disabled()"
          (valueChange)="setSectionField('seo', field.key, $event)"
        />
      }
    </div>
  </app-admin-section-card>
</div>
