@if (loading() && !data()) {
  <app-admin-loading-skeleton variant="detail" />
} @else if (error() && !data()) {
  <app-admin-error-alert [message]="error()!" />
} @else if (data(); as memberships) {
  <app-admin-stat-grid>
    <app-admin-stat-card [label]="'ADMIN.ANALYTICS.STATS.ACTIVE_MEMBERSHIPS' | translate" [value]="memberships.activeCount" icon="pi-id-card" tone="success" />
    <app-admin-stat-card [label]="'ADMIN.ANALYTICS.STATS.NEW_MEMBERSHIPS' | translate" [value]="memberships.newInPeriod" icon="pi-plus" />
    <app-admin-stat-card [label]="'ADMIN.ANALYTICS.STATS.RENEWALS' | translate" [value]="memberships.renewalsInPeriod" icon="pi-refresh" />
    <app-admin-stat-card [label]="'ADMIN.ANALYTICS.STATS.CANCELLATIONS' | translate" [value]="memberships.cancellationsInPeriod" icon="pi-times" tone="warning" />
    <app-admin-stat-card [label]="'ADMIN.ANALYTICS.STATS.MRR' | translate" [value]="(memberships.mrr | number: '1.0-2') ?? '—'" icon="pi-calendar" />
    <app-admin-stat-card [label]="'ADMIN.ANALYTICS.STATS.ARR' | translate" [value]="(memberships.arr | number: '1.0-2') ?? '—'" icon="pi-chart-bar" />
    <app-admin-stat-card [label]="'ADMIN.ANALYTICS.STATS.MEMBERSHIP_REVENUE' | translate" [value]="(memberships.membershipRevenue | number: '1.0-2') ?? '—'" icon="pi-wallet" />
    <app-admin-stat-card [label]="'ADMIN.ANALYTICS.STATS.CONVERSION_RATE' | translate" [value]="(memberships.conversionRate | number: '1.0-1') + '%'" icon="pi-percentage" />
  </app-admin-stat-grid>

  <div class="analytics-shell__grid">
    <app-admin-section-card [title]="'ADMIN.ANALYTICS.CHARTS.BY_PLAN' | translate">
      @if (memberships.revenueByPlan.length === 0) {
        <app-admin-empty-state [title]="'ADMIN.ANALYTICS.EMPTY.CHART' | translate" />
      } @else {
        <apx-chart
          [series]="planDonut().series"
          [chart]="planDonut().chart"
          [labels]="planDonut().labels"
          [colors]="planDonut().colors"
          [legend]="planDonut().legend"
          [dataLabels]="planDonut().dataLabels"
          [tooltip]="planDonut().tooltip"
          [plotOptions]="planDonut().plotOptions"
        />
      }
    </app-admin-section-card>

    <app-admin-section-card [title]="'ADMIN.ANALYTICS.CHARTS.MEMBERSHIP_SERIES' | translate">
      @if (memberships.series.length === 0) {
        <app-admin-empty-state [title]="'ADMIN.ANALYTICS.EMPTY.CHART' | translate" />
      } @else {
        <apx-chart
          [series]="seriesChart().series"
          [chart]="seriesChart().chart"
          [xaxis]="seriesChart().xaxis"
          [yaxis]="seriesChart().yaxis"
          [stroke]="seriesChart().stroke"
          [dataLabels]="seriesChart().dataLabels"
          [tooltip]="seriesChart().tooltip"
        />
      }
    </app-admin-section-card>
  </div>
}
