<p-drawer
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [header]="'ADMIN.PAGE_BUILDER.LIBRARY.TITLE' | translate"
  position="right"
  [modal]="true"
  [dismissible]="true"
  [closeOnEscape]="true"
  appendTo="body"
  [style]="{ width: 'min(28rem, 92vw)' }"
  styleClass="section-library-drawer"
>
  <app-admin-search-bar
    class="section-library-drawer__search"
    [value]="searchTerm()"
    [placeholder]="'ADMIN.PAGE_BUILDER.LIBRARY.SEARCH_PLACEHOLDER' | translate"
    (searchChange)="searchTerm.set($event)"
  />

  @if (!groups().length) {
    <app-admin-empty-state
      icon="pi pi-search"
      [title]="'ADMIN.PAGE_BUILDER.LIBRARY.EMPTY' | translate"
      [compact]="true"
    />
  } @else {
    @for (group of groups(); track group[0]) {
      <div class="section-library-drawer__group">
        <h4 class="section-library-drawer__group-title">{{ group[0] }}</h4>
        <div class="section-library-drawer__cards">
          @for (variant of group[1]; track variant.variantKey) {
            <button type="button" class="section-library-drawer__card" (click)="select(variant)">
              <i class="pi pi-th-large section-library-drawer__card-icon" aria-hidden="true"></i>
              <span class="section-library-drawer__card-name">{{ variant.displayName }}</span>
              <span class="section-library-drawer__card-key">{{ variant.variantKey }}</span>
            </button>
          }
        </div>
      </div>
    }
  }
</p-drawer>
