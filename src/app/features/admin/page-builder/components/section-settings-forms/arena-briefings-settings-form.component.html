<div class="arena-briefings-form">
  <div class="arena-briefings-form__heading">
    @for (field of fields; track field.key) {
      <app-settings-field
        [field]="field"
        [value]="fieldValue(field.key)"
        [disabled]="disabled()"
        (valueChange)="setField(field.key, $event)"
      />
    }

    <app-button-editor
      [title]="'ADMIN.PAGE_BUILDER.SETTINGS.FIELDS.ARENA_BRIEFINGS.FEATURED_BUTTON.LABEL' | translate"
      [label]="config().featuredButtonText"
      [url]="config().featuredButtonUrl"
      [disabled]="disabled()"
      (labelChange)="setField('featuredButtonText', $event)"
      (urlChange)="setField('featuredButtonUrl', $event)"
    />
  </div>

  @if (!config().sideItems.length) {
    <p class="arena-briefings-form__empty">
      {{ 'ADMIN.PAGE_BUILDER.SETTINGS.FIELDS.ARENA_BRIEFINGS.EMPTY' | translate }}
    </p>
  }

  <ul
    class="arena-briefings-form__list"
    cdkDropList
    [cdkDropListDisabled]="disabled()"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (item of config().sideItems; track item.id; let i = $index) {
      <li class="arena-briefings-form__item" cdkDrag [cdkDragDisabled]="disabled()">
        <i class="pi pi-bars arena-briefings-form__handle" cdkDragHandle aria-hidden="true"></i>

        <div class="arena-briefings-form__item-fields">
          <label class="arena-briefings-form__field">
            <span>{{ 'ADMIN.PAGE_BUILDER.SETTINGS.FIELDS.ARENA_BRIEFINGS.SIDE_TAG_TEXT' | translate }}</span>
            <input
              pInputText
              type="text"
              [ngModel]="item.tagText"
              [disabled]="disabled()"
              (ngModelChange)="updateItem(i, { tagText: $event })"
            />
          </label>

          <label class="arena-briefings-form__field">
            <span>{{ 'ADMIN.PAGE_BUILDER.SETTINGS.FIELDS.ARENA_BRIEFINGS.SIDE_TITLE' | translate }}</span>
            <input
              pInputText
              type="text"
              [ngModel]="item.title"
              [disabled]="disabled()"
              (ngModelChange)="updateItem(i, { title: $event })"
            />
          </label>

          <label class="arena-briefings-form__field arena-briefings-form__field--wide">
            <span>{{ 'ADMIN.PAGE_BUILDER.SETTINGS.FIELDS.ARENA_BRIEFINGS.SIDE_IMAGE_URL' | translate }}</span>
            <app-media-picker
              [value]="item.imageUrl"
              [disabled]="disabled()"
              recommendedSize="800×600px, JPG/WebP"
              (valueChange)="updateItem(i, { imageUrl: $event ?? '' })"
            />
          </label>

          <label class="arena-briefings-form__field arena-briefings-form__field--wide">
            <span>{{ 'ADMIN.PAGE_BUILDER.SETTINGS.FIELDS.ARENA_BRIEFINGS.SIDE_LINK_URL' | translate }}</span>
            <app-route-picker
              [value]="item.linkUrl"
              [disabled]="disabled()"
              (valueChange)="updateItem(i, { linkUrl: $event ?? '' })"
            />
          </label>
        </div>

        <app-admin-icon-button
          icon="pi pi-trash"
          severity="danger"
          [disabled]="disabled()"
          [label]="'ADMIN.PAGE_BUILDER.SETTINGS.FIELDS.ARENA_BRIEFINGS.REMOVE_ITEM' | translate"
          (pressed)="removeItem(i)"
        />
      </li>
    }
  </ul>

  <app-admin-icon-button
    icon="pi pi-plus"
    severity="secondary"
    [disabled]="disabled()"
    [label]="'ADMIN.PAGE_BUILDER.SETTINGS.FIELDS.ARENA_BRIEFINGS.ADD_ITEM' | translate"
    (pressed)="addItem()"
  />
</div>
