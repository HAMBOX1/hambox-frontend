<header class="admin-topbar">
  <div class="admin-topbar__start">
    <button
      type="button"
      class="admin-topbar__menu-btn"
      [attr.aria-label]="'NAVBAR.TOGGLE_NAV' | translate"
      (click)="openMobileMenu()"
    >
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>

    <button
      type="button"
      class="admin-topbar__icon-btn admin-topbar__sidebar-btn"
      [attr.aria-label]="
        (sidebarState.collapsed() ? 'ADMIN.SIDEBAR.EXPAND' : 'ADMIN.SIDEBAR.COLLAPSE') | translate
      "
      (click)="toggleSidebar()"
    >
      <i
        class="pi"
        [class.pi-angle-double-right]="sidebarState.collapsed()"
        [class.pi-angle-double-left]="!sidebarState.collapsed()"
        aria-hidden="true"
      ></i>
    </button>

    <p class="admin-topbar__context">
      <span class="admin-topbar__context-label">{{ 'ADMIN.TOPBAR.WORKSPACE' | translate }}</span>
      <span class="admin-topbar__context-hint">{{ 'ADMIN.TOPBAR.WORKSPACE_HINT' | translate }}</span>
    </p>
  </div>

  <div class="admin-topbar__actions" [attr.aria-label]="'ADMIN.UTILITIES' | translate">
    <div class="admin-topbar__inline-switchers">
      <app-language-switcher />
      <app-currency-switcher />
    </div>

    <div class="admin-topbar__more">
      <button
        type="button"
        class="admin-topbar__icon-btn admin-topbar__more-btn"
        [attr.aria-label]="'ADMIN.TOPBAR.MORE' | translate"
        aria-haspopup="true"
        (click)="morePanel.toggle($event)"
      >
        <i class="pi pi-ellipsis-v" aria-hidden="true"></i>
      </button>

      <p-popover #morePanel>
        <div class="admin-topbar__more-panel" role="menu">
          <app-language-switcher />
          <app-currency-switcher />
        </div>
      </p-popover>
    </div>

    <app-theme-toggle [compact]="true" />

    <a
      class="admin-topbar__profile"
      routerLink="/account/profile"
      [attr.aria-label]="'ADMIN.PROFILE' | translate"
    >
      <span class="admin-topbar__profile-copy">
        <span class="admin-topbar__profile-name">{{ displayName() }}</span>
        <span class="admin-topbar__profile-badge">{{ clearanceLevel() | translate }}</span>
      </span>
      <span class="admin-topbar__avatar" aria-hidden="true">{{ avatarInitial() }}</span>
    </a>
  </div>
</header>
