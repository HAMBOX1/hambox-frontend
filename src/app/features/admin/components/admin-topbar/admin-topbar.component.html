<header class="admin-topbar">
  <div class="admin-topbar__start">
    <button
      type="button"
      class="admin-topbar__menu-btn"
      [attr.aria-label]="'NAVBAR.TOGGLE_NAV' | translate"
      (click)="openMobileMenu()"
    >
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>

    <label class="admin-topbar__search">
      <i class="pi pi-search admin-topbar__search-icon" aria-hidden="true"></i>
      <input
        pInputText
        class="admin-topbar__search-input"
        type="search"
        [placeholder]="'NAVBAR.SEARCH_MARKETPLACE' | translate"
        [value]="searchValue()"
        (input)="onSearchInput($event)"
      />
    </label>
  </div>

  <div class="admin-topbar__actions" [attr.aria-label]="'ADMIN.UTILITIES' | translate">
    <app-language-switcher />
    <app-currency-switcher />
    <app-theme-toggle [compact]="true" />

    <button type="button" class="admin-topbar__icon-btn" [attr.aria-label]="'ACCOUNT.NOTIFICATIONS' | translate">
      <i class="pi pi-bell" aria-hidden="true"></i>
    </button>

    <button type="button" class="admin-topbar__icon-btn" [attr.aria-label]="'ADMIN.MESSAGES' | translate">
      <i class="pi pi-comments" aria-hidden="true"></i>
    </button>

    <button type="button" class="admin-topbar__icon-btn" [attr.aria-label]="'ADMIN.NETWORK_STATUS' | translate">
      <i class="pi pi-wifi" aria-hidden="true"></i>
    </button>

    <a class="admin-topbar__profile" routerLink="/admin/settings" [attr.aria-label]="'ADMIN.PROFILE' | translate">
      <span class="admin-topbar__profile-copy">
        <span class="admin-topbar__profile-name">{{ displayName() }}</span>
        <span class="admin-topbar__profile-badge">{{ clearanceLevel() | translate }}</span>
      </span>
      <span class="admin-topbar__avatar">{{ avatarInitial() }}</span>
    </a>
  </div>
</header>
