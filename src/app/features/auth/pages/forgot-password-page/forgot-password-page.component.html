<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="auth-form__header">
    <h2 class="auth-form__title">Forgot Password</h2>
    <p class="auth-form__subtitle">Enter your email and we'll send reset instructions.</p>
  </div>

  @if (errorMessage()) {
    <p class="auth-form__banner auth-form__banner--error" role="alert">{{ errorMessage() }}</p>
  }

  @if (successMessage()) {
    <p class="auth-form__banner auth-form__banner--success" role="status">{{ successMessage() }}</p>
  }

  <div class="auth-form__field">
    <label class="auth-form__label" for="forgot-email">Email</label>
    <input
      pInputText
      id="forgot-email"
      class="auth-form__input"
      type="email"
      autocomplete="email"
      formControlName="email"
    />
    @if (fieldError('email'); as message) {
      <p class="auth-form__error">{{ message }}</p>
    }
  </div>

  <div class="auth-form__field">
    <ui-turnstile action="forgot-password" (tokenChange)="turnstileToken.set($event)" (expired)="turnstileToken.set(null)" (errored)="turnstileToken.set(null)" />
  </div>

  <div class="auth-form__actions">
    <button
      pButton
      type="submit"
      class="auth-form__submit"
      label="Send Reset Link"
      [loading]="isSubmitting()"
      [disabled]="isSubmitting() || !turnstileToken()"
    ></button>
  </div>

  <p class="auth-form__footer">
    <a routerLink="/auth/login">Back to sign in</a>
  </p>
</form>
