<ui-auth-card
  eyebrow="HAMBOX"
  title="Coming Soon"
  [subtitle]="maintenance.message() || 'We are putting the final touches on HAMBOX. Please check back soon.'"
>
  @if (!showLoginForm()) {
    <button
      type="button"
      class="coming-soon-page__reveal"
      (click)="showLoginForm.set(true)"
    >
      Preview access
    </button>
  } @else {
    @if (errorMessage()) {
      <div class="coming-soon-page__alert" role="alert">{{ errorMessage() }}</div>
    }

    <form class="coming-soon-page__form" [formGroup]="form" (ngSubmit)="submit()">
      <ui-field label="Email" [required]="true" [error]="fieldError('email')">
        <ui-input formControlName="email" type="email" placeholder="you@company.com" autocomplete="username" />
      </ui-field>

      <ui-field label="Password" [required]="true" [error]="fieldError('password')">
        <ui-password-input formControlName="password" placeholder="Enter your password" />
      </ui-field>

      <ui-button
        type="submit"
        label="Continue"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting()"
        [fullWidth]="true"
      />
    </form>
  }
</ui-auth-card>
