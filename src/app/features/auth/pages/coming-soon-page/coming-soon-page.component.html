<ui-auth-card
  eyebrow="HAMBOX"
  [title]="title()"
  [subtitle]="subtitle()"
>
  @if (!showLoginForm()) {
    <button
      type="button"
      class="coming-soon-page__reveal"
      (click)="showLoginForm.set(true)"
    >
      Preview access
    </button>
  } @else {
    @if (errorMessage()) {
      <div class="coming-soon-page__alert" role="alert">{{ errorMessage() }}</div>
    }

    <form class="coming-soon-page__form" [formGroup]="form" (ngSubmit)="submit()">
      <ui-field label="Password" [required]="true" [error]="fieldError('password')">
        <ui-password-input formControlName="password" placeholder="Enter access password" autocomplete="off" />
      </ui-field>

      <ui-button
        type="submit"
        label="Continue"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting()"
        [fullWidth]="true"
      />
    </form>
  }

  <div class="coming-soon-page__social">
    @for (link of socialLinks; track link.label) {
      <a
        class="coming-soon-page__social-btn"
        [href]="link.url"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="link.label"
      >
        <img [src]="link.icon" alt="" aria-hidden="true" />
      </a>
    }
  </div>
</ui-auth-card>
