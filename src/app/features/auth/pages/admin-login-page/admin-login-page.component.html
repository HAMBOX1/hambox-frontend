<ui-auth-card
  [eyebrow]="'AUTH.ADMIN_LOGIN.EYEBROW' | translate"
  [title]="'AUTH.ADMIN_LOGIN.TITLE' | translate"
  [subtitle]="'AUTH.ADMIN_LOGIN.SUBTITLE' | translate"
>
  <button
    uiAuthHeaderActions
    type="button"
    class="admin-login-page__theme"
    (click)="toggleTheme()"
    [attr.aria-label]="'AUTH.ADMIN_LOGIN.TOGGLE_THEME' | translate"
  >
    <i class="pi" [class.pi-moon]="theme.isLight()" [class.pi-sun]="theme.isDark()"></i>
  </button>

  @if (errorMessage()) {
    <div class="admin-login-page__alert" role="alert">{{ errorMessage() }}</div>
  }

  @if (otpDisabledNotice()) {
    <div class="admin-login-page__alert admin-login-page__alert--warning" role="status">
      {{ otpDisabledNotice() }}
    </div>
  }

  <form class="admin-login-page__form" [formGroup]="form" (ngSubmit)="submit()">
    <ui-field [label]="'AUTH.ADMIN_LOGIN.EMAIL' | translate" [required]="true" [error]="fieldError('email')">
      <ui-input
        formControlName="email"
        type="email"
        [placeholder]="'AUTH.ADMIN_LOGIN.EMAIL_PLACEHOLDER' | translate"
        autocomplete="username"
      />
    </ui-field>

    <ui-field [label]="'AUTH.ADMIN_LOGIN.PASSWORD' | translate" [required]="true" [error]="fieldError('password')">
      <ui-password-input formControlName="password" [placeholder]="'AUTH.ADMIN_LOGIN.PASSWORD_PLACEHOLDER' | translate" />
    </ui-field>

    <div class="admin-login-page__meta-row">
      <label class="admin-login-page__remember">
        <input type="checkbox" formControlName="rememberMe" />
        <span>{{ 'AUTH.ADMIN_LOGIN.REMEMBER_ME' | translate }}</span>
      </label>
      <span class="admin-login-page__forgot" aria-disabled="true">{{ 'AUTH.ADMIN_LOGIN.FORGOT_PASSWORD' | translate }}</span>
    </div>

    <ui-button
      class="admin-login-page__submit"
      type="submit"
      [label]="'AUTH.ADMIN_LOGIN.CONTINUE' | translate"
      [loading]="isSubmitting()"
      [disabled]="isSubmitting()"
      [fullWidth]="true"
    />
  </form>

  <p class="admin-login-page__footer">
    {{ 'AUTH.ADMIN_LOGIN.STOREFRONT_PROMPT' | translate }}
    <a routerLink="/auth/login">{{ 'AUTH.ADMIN_LOGIN.STOREFRONT_LINK' | translate }}</a>
  </p>
</ui-auth-card>
