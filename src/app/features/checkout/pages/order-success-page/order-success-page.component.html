<div class="order-success">
  <app-storefront-nav [links]="navLinks()" />

  <main class="order-success__main">
    @if (loading()) {
      <app-loading-skeleton type="detail" [count]="1" />
    } @else if (error() || !orderDetails()) {
      <app-empty-state
        icon="pi pi-exclamation-triangle"
        title="Order unavailable"
        [description]="error() ?? 'This order could not be found.'"
        actionLabel="Try again"
        actionIcon="pi pi-refresh"
        (action)="retry()"
      />
    } @else {
      <app-order-success-hero [orderId]="orderDetails()!.orderId" />

      <div class="order-success__layout">
        <div class="order-success__content">
          <app-order-purchased-items
            [items]="orderDetails()!.items"
            [total]="orderDetails()!.total"
          />
          <app-order-referral-banner />
          @if (recommendations().length > 0) {
            <app-order-recommendations [recommendations]="recommendations()" />
          }
        </div>

        <aside class="order-success__sidebar">
          <app-order-support-sidebar />
        </aside>
      </div>
    }
  </main>

  <app-storefront-footer />
</div>
