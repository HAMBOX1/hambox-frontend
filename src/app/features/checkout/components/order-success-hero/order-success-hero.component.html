<section class="success-hero" aria-label="Order confirmation">
  <div class="success-hero__icon" aria-hidden="true">
    <div class="success-hero__icon-glow"></div>
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2" />
      <path
        d="M12 20.5l5.5 5.5L28 15.5"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>

  <h1 class="success-hero__title">Order Successful</h1>
  <p class="success-hero__order-id">Order ID: {{ orderId() }}</p>

  <div class="success-hero__status">
    <img src="assets/images/flash-bolt.svg" alt="" aria-hidden="true" />
    <span>Processing Delivery</span>
  </div>

  <p class="success-hero__eta">
    Estimated Delivery: <strong>{{ formatDeliveryTime() }}</strong>
  </p>

  <div class="success-hero__actions">
    <a routerLink="/profile" class="success-hero__btn success-hero__btn--primary">View My Codes</a>
    <a routerLink="/profile" class="success-hero__btn success-hero__btn--secondary">Go To My Library</a>
  </div>
</section>
