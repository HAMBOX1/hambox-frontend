<header class="account-topbar">
  <form class="account-topbar__search" (submit)="onSearch($event)">
    <i class="pi pi-search account-topbar__search-icon" aria-hidden="true"></i>
    <input
      class="account-topbar__search-input"
      type="search"
      name="q"
      [placeholder]="'NAVBAR.SEARCH_MARKETPLACE' | translate"
      [attr.aria-label]="'NAVBAR.SEARCH_MARKETPLACE' | translate"
    />
  </form>

  <div class="account-topbar__actions">
    <app-language-switcher />
    <app-currency-switcher />
    <app-theme-toggle [compact]="true" />

    <a
      class="account-topbar__icon-btn"
      routerLink="/account/notifications"
      [attr.aria-label]="'ACCOUNT.NOTIFICATIONS' | translate"
    >
      <i class="pi pi-bell" aria-hidden="true"></i>
      @if (unreadCount() > 0) {
        <span class="account-topbar__badge">{{ unreadCount() }}</span>
      }
    </a>

    <a class="account-topbar__icon-btn" routerLink="/account/profile" [attr.aria-label]="'ACCOUNT.SETTINGS' | translate">
      <i class="pi pi-cog" aria-hidden="true"></i>
    </a>

    <a class="account-topbar__avatar" routerLink="/account/profile" [attr.aria-label]="'ACCOUNT.PROFILE' | translate">
      <span>{{ avatarInitial() }}</span>
    </a>
  </div>
</header>
