<div class="storefront-home">
  <app-storefront-nav [links]="navLinks" />

  @if (error()) {
    <main class="storefront-home__main storefront-home__main--state">
      <app-empty-state
        icon="pi pi-exclamation-triangle"
        title="Unable to load home page"
        [description]="error() ?? 'Something went wrong while loading storefront content.'"
        actionLabel="Try again"
        actionIcon="pi pi-refresh"
        (action)="retryLoad()"
      />
    </main>
  } @else if (loading() || !content()) {
    <main class="storefront-home__main storefront-home__main--state">
      <app-loading-skeleton type="detail" [count]="1" />
      <app-loading-skeleton type="card" [count]="4" />
    </main>
  } @else {
    <main class="storefront-home__main">
      <app-hero-section [hero]="content()!.hero" />
      <app-trust-bar [features]="trustFeatures" />

      @if (hasCategories()) {
        <app-popular-categories [categories]="categories()" />
      } @else {
        <section class="storefront-home__empty-section" aria-label="Categories unavailable">
          <app-empty-state
            icon="pi pi-folder-open"
            title="No categories yet"
            description="Active categories will appear here once they are published in the catalog."
          />
        </section>
      }

      @if (hasFeaturedProducts()) {
        <app-flash-deals-section
          [deals]="featuredProducts()"
          [initialCountdownSeconds]="flashCountdownSeconds()"
        />
      } @else {
        <section class="storefront-home__empty-section" aria-label="Featured products unavailable">
          <app-empty-state
            icon="pi pi-shopping-bag"
            title="No featured products yet"
            description="Active products will appear here once they are published in the catalog."
            actionLabel="Browse store"
            actionIcon="pi pi-arrow-right"
            (action)="browseStore()"
          />
        </section>
      }

      @if (hasTrending()) {
        <app-trending-section
          [featuredProduct]="featuredHighlight()"
          [rankItems]="trendingRanks()"
          [valueItem]="trendingValue()"
        />
      }
    </main>
  }

  <app-storefront-footer />
</div>
