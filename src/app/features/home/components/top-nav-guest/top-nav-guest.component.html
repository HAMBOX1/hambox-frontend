<header
  class="storefront-nav"
  [class.storefront-nav--compact]="compact()"
  [class.storefront-nav--elevated]="elevated()"
  [class.storefront-nav--checkout]="mode() === 'checkout'"
>
  <div class="storefront-nav__container">
    <div class="storefront-nav__grid">
      <a class="storefront-nav__logo-link" routerLink="/home" [attr.aria-label]="'NAVBAR.HOME_ARIA' | translate">
        <img class="storefront-nav__logo" [src]="logoSrc" alt="HAMBOX" width="216" height="64" />
      </a>

      @if (mode() === 'checkout') {
        <p class="storefront-nav__checkout-label">
          <i class="pi pi-lock" aria-hidden="true"></i>
          {{ 'NAVBAR.SECURE_CHECKOUT' | translate }}
        </p>
      } @else {
        <app-storefront-search class="storefront-nav__search-host" />
      }

      <div class="storefront-nav__actions">
        @if (mode() !== 'checkout') {
        <app-language-switcher />
        <app-currency-switcher />
        }

        <app-theme-toggle [compact]="true" />

        <app-cart-nav-widget [compact]="mode() === 'checkout'" />

        <a
          routerLink="/auth/login"
          class="storefront-nav__profile-btn"
          [attr.aria-label]="'NAVBAR.SIGN_IN_ARIA' | translate"
        >
          <i class="pi pi-user" aria-hidden="true"></i>
        </a>
      </div>

      @if (mode() !== 'checkout') {
      <nav class="storefront-nav__categories" [attr.aria-label]="'NAVBAR.CATEGORY_NAV' | translate">
        @for (item of links(); track item.labelKey) {
          <a
            class="storefront-nav__category-link"
            [class.storefront-nav__category-link--active]="isLinkActive(item)"
            [routerLink]="item.route"
            [queryParams]="linkQueryParams(item)"
          >
            {{ item.labelKey | translate }}
          </a>
        }
      </nav>
      }
    </div>
  </div>
</header>
