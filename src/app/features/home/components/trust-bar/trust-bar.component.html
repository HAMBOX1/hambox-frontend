<section class="trust-bar" [attr.aria-label]="'HOME.TRUST.INSTANT_TITLE' | translate">
  <div class="trust-bar__inner">
    <ul class="trust-bar__grid">
      @for (feature of features(); track feature.titleKey) {
        <li class="trust-bar__item">
          <div class="trust-bar__icon" aria-hidden="true">
            <img [src]="feature.iconSrc" alt="" />
          </div>
          <div class="trust-bar__copy">
            <h2 class="trust-bar__title">{{ feature.titleKey | translate }}</h2>
            <p class="trust-bar__description">{{ feature.descriptionKey | translate }}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
