<section
  class="hero"
  aria-labelledby="hambox-hero-title"
  [style.--hero-overlay-opacity]="hero().overlayOpacity"
>
  <div class="hero__media" aria-hidden="true">
    <div class="hero__media-layer motion-parallax" [hamboxParallax]="18">
      <img class="hero__image hero__image--background" [src]="hero().backgroundImageUrl" alt="" />
      @if (hero().overlayImageUrl) {
        <img class="hero__image hero__image--overlay" [src]="hero().overlayImageUrl!" alt="" />
      }
    </div>
    <div class="hero__shade"></div>
    <div class="hero__seam"></div>
  </div>

  <div class="hero__container">
    <div class="hero__copy">
      @if (hero().badgeText) {
        <p class="hero__eyebrow" [style.color]="hero().badgeColor">{{ hero().badgeText }}</p>
      }

      <h1 id="hambox-hero-title" class="hero__title">
        <span class="hero__title-line">{{ hero().title }}</span>
      </h1>

      <p class="hero__description">{{ hero().subtitle }}</p>

      <div class="hero__actions" aria-label="Hero actions">
        <a
          pButton
          [routerLink]="hero().primaryButtonUrl"
          class="hero__button hero__button--primary"
          styleClass="hero__button hero__button--primary"
        >
          <span class="hero__button-label">{{ hero().primaryButtonText }}</span>
          <img class="hero__button-icon" [src]="boltIcon" alt="" aria-hidden="true" />
        </a>

        <a
          pButton
          [routerLink]="hero().secondaryButtonUrl"
          class="hero__button hero__button--secondary"
          styleClass="hero__button hero__button--secondary"
        >
          <span class="hero__button-label">{{ hero().secondaryButtonText }}</span>
        </a>
      </div>
    </div>
  </div>
</section>
