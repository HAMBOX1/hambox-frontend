<section class="flash-deals" aria-labelledby="flash-deals-title">
  <div class="flash-deals__inner">
    <header class="flash-deals__header">
      <div class="flash-deals__heading">
        <div class="flash-deals__label">
          <img [src]="flashIconSrc" alt="" aria-hidden="true" />
          <span>{{ sectionTitle() }}</span>
        </div>
        @if (sectionSubtitle()) {
          <p class="flash-deals__subtitle">{{ sectionSubtitle() }}</p>
        }
        @if (countdownEnabled()) {
          <h2 id="flash-deals-title" class="flash-deals__title">{{ countdownLabel() }}</h2>
        } @else {
          <h2 id="flash-deals-title" class="flash-deals__title">{{ sectionTitle() }}</h2>
        }
      </div>

      @if (showViewAllLink()) {
        <a routerLink="/products" class="flash-deals__link">View all deals</a>
      }
    </header>

    <div class="flash-deals__grid">
      @for (deal of deals(); track deal.id; let i = $index) {
        <div hamboxReveal [hamboxRevealDelay]="i * 60" class="motion-fade-up">
          <app-flash-deal-card [deal]="deal" />
        </div>
      }
    </div>
  </div>
</section>
