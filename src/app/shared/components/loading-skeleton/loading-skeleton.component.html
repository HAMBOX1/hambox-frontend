<ng-container [ngSwitch]="type">
  <!-- Card Skeleton -->
  <div *ngSwitchCase="'card'" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem;">
    <div *ngFor="let item of countArray">
      <div class="surface-card border-round p-4" style="border: 1px solid var(--surface-border)">
        <p-skeleton width="100%" height="150px" styleClass="mb-3"></p-skeleton>
        <p-skeleton width="75%" styleClass="mb-2"></p-skeleton>
        <p-skeleton width="50%" styleClass="mb-4"></p-skeleton>
        <div style="display: flex; justify-content: space-between; margin-top: 1rem;">
          <p-skeleton width="4rem" height="2rem"></p-skeleton>
          <p-skeleton width="6rem" height="2rem"></p-skeleton>
        </div>
      </div>
    </div>
  </div>

  <!-- List Skeleton -->
  <div *ngSwitchCase="'list'" style="width: 100%">
    <div *ngFor="let item of countArray" class="surface-card border-round mb-3 p-3" style="display: flex; align-items: center; border: 1px solid var(--surface-border)">
      <p-skeleton shape="circle" size="4rem" styleClass="mr-3"></p-skeleton>
      <div style="flex: 1">
        <p-skeleton width="100%" styleClass="mb-2"></p-skeleton>
        <p-skeleton width="75%"></p-skeleton>
      </div>
    </div>
  </div>

  <!-- Detail Skeleton -->
  <div *ngSwitchCase="'detail'" class="surface-card p-4 border-round" style="border: 1px solid var(--surface-border)">
    <p-skeleton width="100%" height="300px" styleClass="mb-4"></p-skeleton>
    <p-skeleton width="60%" height="2rem" styleClass="mb-3"></p-skeleton>
    <p-skeleton width="40%" styleClass="mb-4"></p-skeleton>
    <p-skeleton width="100%" styleClass="mb-2"></p-skeleton>
    <p-skeleton width="100%" styleClass="mb-2"></p-skeleton>
    <p-skeleton width="80%" styleClass="mb-4"></p-skeleton>
  </div>
</ng-container>
