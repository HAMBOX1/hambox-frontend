<div class="admin-loading-skeleton" role="status" aria-busy="true" aria-label="Loading">
  @switch (variant()) {
    @case ('table') {
      <div class="admin-loading-skeleton__table">
        @for (row of [].constructor(rows()); track $index) {
          <div class="admin-loading-skeleton__table-row">
            <p-skeleton width="2rem" height="1.25rem" borderRadius="6px" />
            <p-skeleton width="40%" height="1rem" borderRadius="6px" />
            <p-skeleton width="25%" height="1rem" borderRadius="6px" />
            <p-skeleton width="15%" height="1.75rem" borderRadius="999px" />
          </div>
        }
      </div>
    }
    @case ('form') {
      <div class="admin-loading-skeleton__form">
        <p-skeleton width="35%" height="1.75rem" borderRadius="8px" />
        <p-skeleton width="100%" height="3rem" borderRadius="10px" />
        <p-skeleton width="100%" height="6rem" borderRadius="10px" />
        <p-skeleton width="60%" height="3rem" borderRadius="10px" />
      </div>
    }
    @case ('detail') {
      <div class="admin-loading-skeleton__detail">
        <p-skeleton width="45%" height="2rem" borderRadius="8px" />
        <p-skeleton width="70%" height="1rem" borderRadius="6px" />
        <div class="admin-loading-skeleton__stats">
          @for (card of [1, 2, 3, 4]; track card) {
            <p-skeleton width="100%" height="5.5rem" borderRadius="18px" />
          }
        </div>
      </div>
    }
    @default {
      <div class="admin-loading-skeleton__page">
        <p-skeleton width="30%" height="2.5rem" borderRadius="8px" />
        <p-skeleton width="55%" height="1rem" borderRadius="6px" />
        <div class="admin-loading-skeleton__stats">
          @for (card of [1, 2, 3, 4]; track card) {
            <p-skeleton width="100%" height="5.5rem" borderRadius="18px" />
          }
        </div>
        <p-skeleton width="100%" height="18rem" borderRadius="18px" />
      </div>
    }
  }
</div>
