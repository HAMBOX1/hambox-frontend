<ng-template #cardContent>
  <div class="admin-stat-card__top">
    <span class="admin-stat-card__label">{{ label() }}</span>
    @if (icon()) {
      <span class="admin-stat-card__icon-wrap" aria-hidden="true">
        <i [class]="'pi ' + icon()"></i>
      </span>
    }
  </div>
  <strong class="admin-stat-card__value">{{ value() }}</strong>
  @if (hint()) {
    <span class="admin-stat-card__hint">{{ hint() }}</span>
  }
</ng-template>

@if (routerLink()) {
  <a
    class="admin-stat-card admin-stat-card--linkable"
    [class]="'admin-stat-card--' + tone()"
    [class.admin-stat-card--compact]="compact()"
    [routerLink]="routerLink()!"
    [queryParams]="queryParams()"
  >
    <ng-container *ngTemplateOutlet="cardContent" />
  </a>
} @else {
  <article class="admin-stat-card" [class]="'admin-stat-card--' + tone()" [class.admin-stat-card--compact]="compact()">
    <ng-container *ngTemplateOutlet="cardContent" />
  </article>
}
