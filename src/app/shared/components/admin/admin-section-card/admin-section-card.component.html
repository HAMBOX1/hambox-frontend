<section class="admin-section-card admin-glass-card">
  @if (title()) {
    <header class="admin-section-card__header" [class.admin-section-card__header--plain]="noDivider()">
      <div>
        <h2 class="admin-section-card__title">{{ title() }}</h2>
        @if (description()) {
          <p class="admin-section-card__description">{{ description() }}</p>
        }
      </div>
      <div class="admin-section-card__header-actions">
        <ng-content select="[adminSectionActions]" />
      </div>
    </header>
  }

  <div class="admin-section-card__body" [class.admin-section-card__body--padded]="padded()">
    <ng-content />
  </div>
</section>
