<button
  type="button"
  class="admin-action-menu__trigger"
  [attr.aria-label]="label()"
  [disabled]="disabled()"
  (click)="toggle($event)"
>
  <i [class]="icon()" aria-hidden="true"></i>
</button>

<p-menu #menu [model]="items()" [popup]="true" appendTo="body" styleClass="admin-action-menu__panel" />
